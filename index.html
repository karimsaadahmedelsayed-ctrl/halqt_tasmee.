    <script>
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OriginalWebSocket = window.WebSocket;
          function MockHmrSocket() {
            this.readyState = 1;
            this.OPEN = 1;
            this.CLOSED = 3;
            this.CLOSING = 2;
            this.CONNECTING = 0;
            this._listeners = {};
          }
          MockHmrSocket.prototype.addEventListener = function(event, callback) {
            this._listeners[event] = this._listeners[event] || [];
            this._listeners[event].push(callback);
            if (event === 'open') {
              var self = this;
              setTimeout(function() {
                try { callback.call(self, { type: 'open' }); } catch (e) {}
              }, 0);
            }
          };
          MockHmrSocket.prototype.removeEventListener = function(event, callback) {
            if (!this._listeners[event]) return;
            this._listeners[event] = this._listeners[event].filter(function(cb) { return cb !== callback; });
          };
          MockHmrSocket.prototype.send = function() {};
          MockHmrSocket.prototype.close = function() {
            this.readyState = 3;
          };

          function PatchedWebSocket(url, protocols) {
            if (
              (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('24678') || url.includes('token='))) ||
              protocols === 'vite-hmr'
            ) {
              return new MockHmrSocket();
            }
            return new OriginalWebSocket(url, protocols);
          }
          PatchedWebSocket.prototype = OriginalWebSocket.prototype;
          PatchedWebSocket.OPEN = 1;
          PatchedWebSocket.CLOSED = 3;
          PatchedWebSocket.CLOSING = 2;
          PatchedWebSocket.CONNECTING = 0;
          window.WebSocket = PatchedWebSocket;
        }

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = reason && (reason.message || String(reason));
          if (typeof msg === 'string' && msg.includes('WebSocket')) {
            event.preventDefault();
          }
        });
        window.addEventListener('error', function(event) {
          var msg = event && (event.message || (event.error && event.error.message));
          if (typeof msg === 'string' && msg.includes('WebSocket')) {
            event.preventDefault();
          }
        });
      })();
    </script>

      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) { caches.delete(name); }
